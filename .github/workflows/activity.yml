# Generates a real GitHub Activity Graph SVG from the GraphQL API.
# The SVG is committed to the `output` branch and rendered via raw.githubusercontent.com.
#
# Data sources:
#   - GitHub GraphQL API: contributionCalendar (daily contributions, last 30 days)
#   - Computed: current streak, longest streak, active days, total contributions
#
# Every number in the SVG comes from the live GitHub API — nothing is hardcoded.
#
# IMPORTANT: Uses manual git push — NOT ghaction-github-pages — to avoid overwriting
# other files on the output branch (e.g. contribution snake SVGs).

name: Generate Activity Graph

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate activity graph SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 .github/scripts/generate_activity.py "$OWNER" dist
          ls -la dist/

      - name: Checkout output branch
        run: |
          git checkout output 2>/dev/null || git checkout -b output origin/output

      - name: Copy SVG and push if changed
        run: |
          cp dist/activity.svg activity.svg
          if git diff --quiet activity.svg 2>/dev/null; then
            echo "No changes to activity.svg — skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add activity.svg
            git commit -m "chore: update activity graph [skip ci]"
            git push origin output
            echo "Committed and pushed activity.svg"
          fi

      - name: Workflow summary
        run: |
          echo "## Activity Graph Updated" >> $GITHUB_STEP_SUMMARY
          echo "- Generated from real GitHub contributions of **${{ github.repository_owner }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Data source: GitHub GraphQL API \`contributionsCollection\`" >> $GITHUB_STEP_SUMMARY
          echo "- Committed **activity.svg** to the **output** branch" >> $GITHUB_STEP_SUMMARY
          echo "- All statistics are live — no hardcoded values" >> $GITHUB_STEP_SUMMARY
