# Generates a real GitHub Activity Graph SVG from the GraphQL API.
# The SVG is committed to the `output` branch and rendered via raw.githubusercontent.com.
#
# Data sources:
#   - GitHub GraphQL API: contributionsCollection.contributionCalendar (current year)
#   - GitHub REST API: /users/{user}/events/public (fallback)
#
# Every number in the SVG comes from the live GitHub API -- nothing is hardcoded.
#
# IMPORTANT: Uses manual git push -- NOT ghaction-github-pages -- to avoid overwriting
# other files on the output branch (e.g. contribution snake SVGs).

name: Generate Activity Graph

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate activity graph SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 .github/scripts/generate_activity.py "$OWNER" dist
          echo "Generated files:"
          ls -la dist/
          echo "---"
          head -c 200 dist/activity.svg

      - name: Push SVG to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Save the generated SVG to a temp location
          cp dist/activity.svg /tmp/activity.svg

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the output branch
          git fetch origin output

          # Create a worktree with a local branch tracking origin/output
          git worktree add /tmp/output-worktree -b output origin/output

          # Copy the SVG into the output branch worktree
          cp /tmp/activity.svg /tmp/output-worktree/activity.svg

          # Commit and push if there are changes
          cd /tmp/output-worktree
          if git diff --quiet activity.svg 2>/dev/null; then
            echo "No changes to activity.svg -- skipping commit"
          else
            git add activity.svg
            git commit -m "chore: update activity graph [skip ci]"
            git push origin output
            echo "Committed and pushed activity.svg"
          fi

          # Clean up worktree
          cd -
          git worktree remove /tmp/output-worktree 2>/dev/null || true

      - name: Workflow summary
        run: |
          echo "## Activity Graph Updated" >> $GITHUB_STEP_SUMMARY
          echo "- Generated from real GitHub contributions of **${{ github.repository_owner }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Data source: GitHub GraphQL API + REST API fallback" >> $GITHUB_STEP_SUMMARY
          echo "- Committed **activity.svg** to the **output** branch" >> $GITHUB_STEP_SUMMARY
          echo "- All statistics are live -- no hardcoded values" >> $GITHUB_STEP_SUMMARY
