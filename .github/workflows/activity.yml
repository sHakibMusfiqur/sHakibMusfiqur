# Generates a real GitHub Activity Graph SVG from the GraphQL API.
# The SVG is committed to the `output` branch and rendered via raw.githubusercontent.com.
#
# Data sources:
#   - GitHub GraphQL API: contributionCalendar (daily contributions, last 30 days)
#   - Computed: current streak, longest streak, active days, total contributions
#
# Every number in the SVG comes from the live GitHub API — nothing is hardcoded.

name: Generate Activity Graph

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate_activity.py "$OWNER" dist

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Workflow summary
        run: |
          echo "## Activity Graph Updated" >> $GITHUB_STEP_SUMMARY
          echo "- Generated from real GitHub contributions of **${{ github.repository_owner }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Data source: GitHub GraphQL API \`contributionsCollection\`" >> $GITHUB_STEP_SUMMARY
          echo "- Committed **activity.svg** to the **output** branch" >> $GITHUB_STEP_SUMMARY
          echo "- All statistics are live — no hardcoded values" >> $GITHUB_STEP_SUMMARY
