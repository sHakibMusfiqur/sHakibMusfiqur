# Generates and commits a self-hosted GitHub stats SVG as a single file.
# Output is pushed to the `stats` branch and read via raw.githubusercontent.com.
#
# Design: Clean, table-based layout inspired by GitHub Insights.
# No donut charts, no animated bars, no AI dashboard aesthetics.
# Pure typography + horizontal progress bars for language distribution.

name: Generate Stats Dashboard

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats dashboard SVG
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat > /tmp/gen_stats.py <<'PY'
          #!/usr/bin/env python3
          import json, math, os, sys, urllib.parse, urllib.request

          # GitHub-native palette
          BG="#0D1117"; CARD="#161B22"; BORDER="#30363D"
          TEXT="#E6EDF3"; MUTED="#8B949E"; DIM="#484F58"
          ACCENT="#58A6FF"; GREEN="#3FB950"; PURPLE="#BC8CFF"
          SANS="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          MONO="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
          API="https://api.github.com"

          def request(url, token, data=None, accept="application/vnd.github+json"):
              req=urllib.request.Request(url, data=(json.dumps(data).encode() if data is not None else None), method="POST" if data is not None else "GET")
              req.add_header("Accept", accept)
              req.add_header("User-Agent","profile-stats-action")
              if token: req.add_header("Authorization","Bearer "+token)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def esc(s): return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
          def fmt(n): return f"{int(n):,}"

          user=sys.argv[1]; token=os.environ.get("GITHUB_TOKEN",""); outdir=sys.argv[2]
          outfile=os.path.join(outdir,"stats.svg")

          # ---- Fetch data from GitHub API ----
          stars=0; repos=0; langs={}; page=1
          while True:
              data=request(f"{API}/users/{user}/repos?per_page=100&page={page}&type=owner", token)
              if not isinstance(data, list) or not data: break
              repos+=len(data)
              for repo in data:
                  stars+=int(repo.get("stargazers_count",0) or 0)
                  lg=repo.get("language")
                  if lg: langs[lg]=langs.get(lg,0)+1
              if len(data)<100: break
              page+=1

          def search_total(path, q, accept="application/vnd.github+json"):
              try:
                  d=request(f"{API}/search/{path}?q="+urllib.parse.quote(q)+"&per_page=1", token, accept=accept)
                  return int(d.get("total_count",0))
              except Exception:
                  return 0
          commits=search_total("commits", f"author:{user}", accept="application/vnd.github.cloak-preview+json")
          prs=search_total("issues", f"author:{user} type:pr")
          issues=search_total("issues", f"author:{user} type:issue")

          contribs=0
          try:
              query='query{user(login:"%s"){contributionsCollection{contributionCalendar{totalContributions}}}}'%user
              g=request(API+"/graphql", token, data={"query":query}, accept="application/vnd.github+json")
              contribs=int(g["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"])
          except Exception:
              contribs=0

          # Language distribution
          total=sum(langs.values()) or 1
          top=sorted(langs.items(), key=lambda kv: kv[1], reverse=True)[:5]
          names=[n for n,_ in top]; pcts=[c/total*100 for _,c in top]
          other=total-sum(c for _,c in top)
          if other>0:
              names.append("Other"); pcts.append(other/total*100)
          if not names:
              names=["Other"]; pcts=[100.0]

          BRAND={"Python":"#3776AB","TypeScript":"#3178C6","JavaScript":"#F0DB4F","PHP":"#777BB4",
                 "C++":"#659AD2","C":"#A8B9CC","C#":"#68217A","Java":"#B07219","Go":"#00ADD8",
                 "Rust":"#DEA584","SQL":"#E38C00","HTML":"#E34F26","CSS":"#1572B6",
                 "Jupyter Notebook":"#DA5B0B","Shell":"#89E051","Dockerfile":"#2496ED",
                 "Kotlin":"#A97BFF","Swift":"#F05138","Dart":"#00B4AB","Vue":"#41B883","Ruby":"#CC342D"}
          def brand(name): return BRAND.get(name, ACCENT)

          # ---- SVG assembly: table-based layout ----
          W=980; ROW_H=42; PAD=32; HEADER_H=52
          STAT_ROWS=5; LANG_ROWS=len(names)
          TOTAL_ROWS=max(STAT_ROWS, LANG_ROWS)
          H=HEADER_H+PAD+TOTAL_ROWS*ROW_H+PAD+8

          out=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 %d %d" width="%d" height="%d" role="img" aria-label="GitHub stats for %s">'%(W,H,W,H,esc(user))]

          # Background
          out.append('<rect width="%d" height="%d" rx="6" fill="%s"/>'%(W,H,CARD))
          out.append('<rect width="%d" height="1" fill="%s" opacity="0.4"/>'%(W,BORDER))

          # Header
          out.append('<text x="%d" y="%d" font-family="%s" font-size="14" font-weight="600" fill="%s">GitHub Stats</text>'%(PAD,34,SANS,TEXT))
          out.append('<text x="%d" y="%d" font-family="%s" font-size="11" fill="%s">github.com/%s</text>'%(PAD,50,SANS,MUTED,esc(user)))

          # Vertical divider
          div_x=480
          out.append('<line x1="%d" y1="%d" x2="%d" y2="%d" stroke="%s" stroke-width="1"/>'%(div_x,HEADER_H,div_x,HEADER_H+TOTAL_ROWS*ROW_H,BORDER))

          # Left column: Statistics table
          stats=[
              ("Repositories", fmt(repos)),
              ("Commits", fmt(commits)),
              ("Pull Requests", fmt(prs)),
              ("Issues", fmt(issues)),
              ("Contributions", fmt(contribs)),
          ]
          y=HEADER_H+8
          for i,(label,val) in enumerate(stats):
              bg=' fill="%s"'%("#1C2128" if i%2==0 else CARD)
              out.append('<rect x="0" y="%d" width="%d" height="%d"%s/>'%(y,div_x,ROW_H,bg))
              out.append('<text x="%d" y="%d" font-family="%s" font-size="13" fill="%s">%s</text>'%(PAD,y+27,SANS,MUTED,esc(label)))
              out.append('<text x="%d" y="%d" font-family="%s" font-size="14" font-weight="600" fill="%s" text-anchor="end">%s</text>'%(div_x-20,y+27,SANS,TEXT,esc(val)))
              y+=ROW_H

          # Right column: Language distribution (horizontal bars)
          y=HEADER_H+8
          bar_x=div_x+PAD; bar_w=W-div_x-PAD*2
          for i,(name,pct) in enumerate(zip(names,pcts)):
              bg=' fill="%s"'%("#1C2128" if i%2==0 else CARD)
              out.append('<rect x="%d" y="%d" width="%d" height="%d"%s/>'%(div_x,y,div_x,ROW_H,bg))
              color=brand(name)
              out.append('<rect x="%d" y="%d" width="%d" height="8" rx="4" fill="%s" opacity="0.15"/>'%(bar_x,y+10,bar_w,color))
              bw=max(bar_w*pct/100.0,2)
              out.append('<rect x="%d" y="%d" width="%d" height="8" rx="4" fill="%s"/>'%(bar_x,y+10,bw,color))
              out.append('<text x="%d" y="%d" font-family="%s" font-size="12" fill="%s">%s</text>'%(bar_x,y+34,SANS,TEXT,esc(name)))
              out.append('<text x="%d" y="%d" font-family="%s" font-size="11" font-weight="600" fill="%s" text-anchor="end">%s%%</text>'%(bar_x+bar_w,y+34,SANS,MUTED,round(pct)))
              y+=ROW_H

          # Bottom border
          out.append('<line x1="0" y1="%d" x2="%d" y2="%d" stroke="%s" stroke-width="1"/>'%(H-1,W,H-1,BORDER))

          out.append("</svg>")
          open(outfile,"w",encoding="utf-8").write("\n".join(out))
          print(f"Generated stats for {user}: {outfile}")
          PY
          mkdir -p dist
          GITHUB_TOKEN="$GH_TOKEN" python3 /tmp/gen_stats.py "$OWNER" dist

      - name: Push SVGs to the stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Workflow summary
        run: |
          echo "## GitHub Stats Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- Committed **stats.svg** to the **stats** branch" >> $GITHUB_STEP_SUMMARY
          echo "- Sources: GitHub REST (repos, stars, commits, PR, issues) + GraphQL (contributions)" >> $GITHUB_STEP_SUMMARY
          echo "- Layout: Clean table-based design, no donut charts or animated elements" >> $GITHUB_STEP_SUMMARY