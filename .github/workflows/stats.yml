# Generates and commits a self-hosted GitHub stats dashboard as a single SVG.
# This removes the dependency on the flaky public github-readme-stats instance,
# so the stats card always renders. Output is pushed to the `stats` branch and
# read via raw.githubusercontent.com.
#
# The card uses a dark #0D1117 "analytics panel" theme with a red accent
# (#C41E3A) and violet secondary (#7C3AED). It is built purely from the GitHub
# API (search + GraphQL), so no broken third-party widgets are involved.

name: Generate Stats Dashboard

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats dashboard SVG
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat > /tmp/gen_stats.py <<'PY'
          #!/usr/bin/env python3
          import json, math, os, sys, urllib.parse, urllib.request

          # palette
          BG="#0D1117"; BORDER="#21262D"; TRACK="#161B22"
          RED="#C41E3A"; VIOLET="#7C3AED"
          INK="#E6EDF3"; SUB="#F1F5F9"; MUTED="#8B949E"
          SANS="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          MONO="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, monospace"
          API="https://api.github.com"

          def request(url, token, data=None, accept="application/vnd.github+json"):
              req=urllib.request.Request(url, data=(json.dumps(data).encode() if data is not None else None), method="POST" if data is not None else "GET")
              req.add_header("Accept", accept)
              req.add_header("User-Agent","profile-stats-action")
              if token: req.add_header("Authorization","Bearer "+token)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def esc(s): return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
          def fmt(n): return f"{int(n):,}"

          user=sys.argv[1]; token=os.environ.get("GITHUB_TOKEN",""); outdir=sys.argv[2]
          outfile=os.path.join(outdir,"stats.svg")

          # ---- Repo-level data: stars + primary languages (REST) ----
          stars=0; langs={}; page=1
          while True:
              data=request(f"{API}/users/{user}/repos?per_page=100&page={page}&type=owner", token)
              if not isinstance(data, list) or not data: break
              for repo in data:
                  stars+=int(repo.get("stargazers_count",0) or 0)
                  lg=repo.get("language")
                  if lg: langs[lg]=langs.get(lg,0)+1
              if len(data)<100: break
              page+=1

          #   All-time activity counters (REST search API)
          def search_total(path, q, accept="application/vnd.github+json"):
              try:
                  d=request(f"{API}/search/{path}?q="+urllib.parse.quote(q)+"&per_page=1", token, accept=accept)
                  return int(d.get("total_count",0))
              except Exception:
                  return 0
          commits=search_total("commits", f"author:{user}", accept="application/vnd.github.cloak-preview+json")
          prs=search_total("issues", f"author:{user} type:pr")
          issues=search_total("issues", f"author:{user} type:issue")

          # Contributions in the last year (GraphQL API)
          contribs=0
          try:
              query='query{user(login:"%s"){contributionsCollection{contributionCalendar{totalContributions}}}}'%user
              g=request(API+"/graphql", token, data={"query":query}, accept="application/vnd.github+json")
              contribs=int(g["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"])
          except Exception:
              contribs=0

          #   Language distribution
          total=sum(langs.values()) or 1
          top=sorted(langs.items(), key=lambda kv: kv[1], reverse=True)[:5]
          names=[n for n,_ in top]; pcts=[c/total*100 for _,c in top]
          other=total-sum(c for _,c in top)
          if other>0:
              names.append("Other"); pcts.append(other/total*100)
          if not names:
              names=["Other"]; pcts=[100.0]

          BRAND={"Python":"#3776AB","TypeScript":"#3178C6","JavaScript":"#F0DB4F","PHP":"#777BB4",
                 "C++":"#659AD2","C":"#A8B9CC","C#":"#68217A","Java":"#B07219","Go":"#00ADD8",
                 "Rust":"#DEA584","SQL":"#E38C00","HTML":"#E34F26","CSS":"#1572B6",
                 "Jupyter Notebook":"#DA5B0B","Shell":"#89E051","Dockerfile":"#2496ED",
                 "Kotlin":"#A97BFF","Swift":"#F05138","Dart":"#00B4AB","Vue":"#41B883","Ruby":"#CC342D"}
          def brand(name):
              return BRAND.get(name, VIOLET)

          #   SVG assembly ------------
          W,H=980,360
          out=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 %d %d" width="%d" height="%d" role="img" aria-label="GitHub stats dashboard for %s">'%(W,H,W,H,esc(user))]
          out.append('<rect x="1" y="1" width="%d" height="%d" rx="24" fill="%s" stroke="%s" stroke-width="1"/>'%(W-2,H-2,BG,BORDER))
          out.append('<rect x="1" y="1" width="%d" height="6" rx="3" fill="%s"/>'%(W-2,RED))
          # titles
          out.append('<rect x="48" y="40" width="4" height="18" rx="2" fill="%s"/>'%RED)
          out.append('<text x="62" y="55" font-family="%s" font-size="14" font-weight="700" fill="%s" letter-spacing="2">GITHUB STATS</text>'%(SANS,INK))
          out.append('<rect x="608" y="40" width="4" height="18" rx="2" fill="%s"/>'%VIOLET)
          out.append('<text x="622" y="55" font-family="%s" font-size="14" font-weight="700" fill="%s" letter-spacing="2">MOST USED LANGUAGES</text>'%(SANS,INK))
          out.append('<line x1="560" y1="72" x2="560" y2="330" stroke="%s" stroke-width="1"/>'%BORDER)

          # left: stat rows
          labels=["Total Stars","Total Commits","Pull Requests","Issues","Contributions This Year"]
          values=[stars,commits,prs,issues,contribs]
          y=112
          for label,val in zip(labels,values):
              out.append(f'<text x="48" y="{y}" font-family="{SANS}" font-size="13.5" font-weight="500" fill="{MUTED}">{esc(label)}</text>')
              out.append(f'<text x="360" text-anchor="end" y="{y}" font-family="{MONO}" font-size="16" font-weight="700" fill="{INK}">{esc(fmt(val))}</text>')
              y+=36

          # left: circular language donut
          cx,cy,R=455,168,70.0; C=2*math.pi*R
          palette=[RED,VIOLET,"#E2E8F0","#94A3B8","#64748B","#334155"]
          angle=0.0
          for i,pct in enumerate(pcts[:6]):
              ln=max(C*pct/100.0, 0.0); col=palette[i%len(palette)]
              out.append(f'<circle cx="{cx}" cy="{cy}" r="{R:.1f}" fill="none" stroke="{col}" stroke-width="15" stroke-dasharray="{ln:.1f} {C-ln:.1f}" transform="rotate({angle:.1f} {cx} {cy})"/>')
              angle+=pct*3.6
          out.append(f'<text x="{cx}" text-anchor="middle" y="{cy-8}" font-family="{SANS}" font-size="12" font-weight="700" fill="{MUTED}" letter-spacing="1">{esc(names[0].upper())}</text>')
          out.append(f'<text x="{cx}" text-anchor="middle" y="{cy+14}" font-family="{MONO}" font-size="18" font-weight="800" fill="{RED}">{pcts[0]:.0f}%</text>')
          # donut legend
          lx,ly=398,300
          for name,pct in zip(names[:3],pcts[:3]):
              out.append(f'<circle cx="{lx}" cy="{ly-3}" r="3.5" fill="{brand(name)}"/>')
              out.append(f'<text x="{lx+12}" y="{ly}" font-family="{SANS}" font-size="11.5" font-weight="500" fill="{MUTED}">{esc(name)}</text>')
              out.append(f'<text x="{lx+130}" text-anchor="end" y="{ly}" font-family="{MONO}" font-size="11.5" font-weight="600" fill="{INK}">{pct:.0f}%</text>')
              ly+=26

          # right: animated language bars
          y=108
          for name,pct in zip(names,pcts):
              bw=300*pct/100.0
              out.append(f'<circle cx="612" cy="{y-3}" r="4" fill="{brand(name)}"/>')
              out.append(f'<text x="628" y="{y}" font-family="{SANS}" font-size="13.5" font-weight="600" fill="{INK}">{esc(name)}</text>')
              out.append(f'<text x="928" text-anchor="end" y="{y}" font-family="{MONO}" font-size="13" font-weight="700" fill="{MUTED}">{pct:.0f}%</text>')
              out.append(f'<rect x="628" y="{y+10}" width="300" height="7" rx="3.5" fill="{TRACK}"/>')
              out.append(f'<rect x="628" y="{y+10}" width="{bw:.1f}" height="7" rx="3.5" fill="{RED}"><animate attributeName="width" from="0" to="{bw:.1f}" dur="1.2s" repeatCount="1" fill="freeze"/></rect>')
              y+=40

          out.append(f'<text x="48" y="{H-16}" font-family="{SANS}" font-size="10.5" fill="{MUTED}">github.com/{esc(user)}</text>')
          out.append("</svg>")
          open(outfile,"w",encoding="utf-8").write("\n".join(out))
          print(f"Generated dashboard for {user}: {outfile}")
          PY
          mkdir -p dist
          GITHUB_TOKEN="$GH_TOKEN" python3 /tmp/gen_stats.py "$OWNER" dist

      - name: Push SVGs to the stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Workflow summary
        run: |
          echo "## GitHub Stats Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- Committed **stats.svg** to the **stats** branch" >> $GITHUB_STEP_SUMMARY
          echo "- Sources: GitHub REST (stars, commits, PR, issues) + GraphQL (contributions, languages)" >> $GITHUB_STEP_SUMMARY