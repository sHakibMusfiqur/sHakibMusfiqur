<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Profile background">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E31E45"/>
      <stop offset="1" stop-color="#8E1227"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.12" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#C41E3A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C41E3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grayGlow" cx="0.9" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#64748B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#64748B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E2E8F0" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#bgGrad)"/>
  <rect width="960" height="400" fill="url(#grid)"/>
  <rect width="960" height="400" fill="url(#redGlow)"/>
  <rect width="960" height="400" fill="url(#grayGlow)"/>

  <g fill="none" stroke="#C41E3A">
    <circle cx="140" cy="90" r="90" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="140" cy="90" r="70" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
  <circle cx="140" cy="90" r="4" fill="url(#redGrad)" opacity="0.7"/>

  <g fill="none" stroke="#CBD5E1" stroke-width="1.5">
    <circle cx="836" cy="326" r="84" stroke-opacity="0.5"/>
    <circle cx="836" cy="326" r="60" stroke-opacity="0.3"/>
  </g>

  <path d="M60 352 C 300 322 520 300 900 276" fill="none" stroke="url(#redGrad)" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="688" y="128" width="218" height="108" rx="18" fill="#FFFFFF" fill-opacity="0.78" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="712" y="152" width="56" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="712" y="176" width="120" height="8" rx="4" fill="#EEF2F7"/>
    <rect x="712" y="192" width="100" height="8" rx="4" fill="#EEF2F7"/>
    <rect x="712" y="208" width="112" height="8" rx="4" fill="#EEF2F7"/>
    <rect x="848" y="148" width="32" height="32" rx="8" fill="url(#redGrad)" opacity="0.92"/>
  </g>

  <circle cx="96" cy="96" r="3" fill="#C41E3A" opacity="0.4"/>
  <circle cx="122" cy="118" r="2" fill="#94A3B8" opacity="0.7"/>
  <circle cx="860" cy="80" r="2.5" fill="#C41E3A" opacity="0.5"/>
  <circle cx="886" cy="104" r="1.8" fill="#CBD5E1"/>
</svg>
