<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Musfiqur Shakib — Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E31E45"/>
      <stop offset="0.5" stop-color="#C41E3A"/>
      <stop offset="1" stop-color="#8E1227"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.85" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#C41E3A" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#C41E3A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C41E3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grayGlow" cx="0.05" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#64748B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#64748B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E2E8F0" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#fadeBottom)"/>
  <rect width="1200" height="340" fill="url(#redGlow)"/>
  <rect width="1200" height="340" fill="url(#grayGlow)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#redGrad)"/>

  <g stroke="#C41E3A" fill="none">
    <circle cx="1012" cy="48" r="122" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="1012" cy="48" r="100" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1012" cy="48" r="78" stroke-opacity="0.10" stroke-width="1"/>
  </g>
  <circle cx="1012" cy="48" r="5" fill="url(#redGrad)" opacity="0.85"/>

  <g stroke="#CBD5E1" fill="none" stroke-width="1.5">
    <circle cx="196" cy="308" r="64" stroke-opacity="0.5"/>
    <circle cx="196" cy="308" r="44" stroke-opacity="0.35"/>
  </g>

  <circle cx="884" cy="268" r="3.5" fill="#C41E3A" opacity="0.55"/>
  <circle cx="918" cy="242" r="2.5" fill="#94A3B8" opacity="0.7"/>
  <circle cx="330" cy="76" r="3" fill="#C41E3A" opacity="0.4"/>
  <circle cx="358" cy="98" r="2" fill="#CBD5E1" opacity="0.9"/>

  <path d="M72 250 C 520 222 720 206 1130 192" fill="none" stroke="url(#redGrad)" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="848" y="118" width="296" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.82" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="878" cy="148" r="6" fill="#C41E3A"/>
    <text x="896" y="143" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0B1220" letter-spacing="1.5">OPEN TO OPPORTUNITIES</text>
    <text x="896" y="162" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B" letter-spacing="0.4">Enterprise &#183; SaaS &#183; AI &#183; Platform</text>
  </g>

  <text x="72" y="112" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#C41E3A" letter-spacing="6">SOFTWARE ENGINEER</text>
  <text x="72" y="196" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="56" font-weight="800" fill="#0B1220" letter-spacing="-1.5">Musfiqur Shakib</text>
  <rect x="74" y="222" width="96" height="5" rx="2.5" fill="url(#redGrad)"/>
  <text x="72" y="276" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" letter-spacing="0.3">Full Stack &#183; AI &#183; Platform Engineering</text>
