<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Musfiqur Shakib — Software Engineer (dark)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#131C30"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E31E45"/>
      <stop offset="0.5" stop-color="#C41E3A"/>
      <stop offset="1" stop-color="#8E1227"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.85" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#C41E3A" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#C41E3A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C41E3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grayGlow" cx="0.05" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#64748B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#64748B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#24304A" stroke-opacity="0.6" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#fadeBottom)"/>
  <rect width="1200" height="340" fill="url(#redGlow)"/>
  <rect width="1200" height="340" fill="url(#grayGlow)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#redGrad)"/>

  <g stroke="#C41E3A" fill="none">
    <circle cx="1060" cy="60" r="140" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="1060" cy="60" r="110" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="1060" cy="60" r="80" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <circle cx="1060" cy="60" r="4" fill="url(#redGrad)" opacity="0.7"/>

  <g stroke="#334155" fill="none" stroke-width="1">
    <circle cx="180" cy="310" r="70" stroke-opacity="0.6"/>
    <circle cx="180" cy="310" r="48" stroke-opacity="0.4"/>
  </g>

  <text x="72" y="108" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#E31E45" letter-spacing="5">SOFTWARE ENGINEER</text>
  <text x="72" y="180" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="58" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Musfiqur Shakib</text>
  <rect x="74" y="200" width="80" height="4" rx="2" fill="url(#redGrad)"/>
  <text x="72" y="250" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="0.2">Building Scalable Web Applications &amp; Enterprise Software</text>
</svg>
